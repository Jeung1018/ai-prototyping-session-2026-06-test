<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>안녕하세요 👋</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        "Helvetica Neue", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      background: linear-gradient(135deg, #6a11cb 0%, #a855f7 50%, #c471f5 100%);
      padding: 24px;
    }

    .card {
      background: #ffffff;
      border-radius: 24px;
      padding: 48px 40px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 60px rgba(76, 29, 149, 0.35);
    }

    .card h1 {
      font-size: 2.2rem;
      color: #1f2937;
      margin-bottom: 12px;
    }

    .card p {
      font-size: 1.05rem;
      color: #6b7280;
      margin-bottom: 28px;
    }

    button {
      border: none;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 600;
      color: #ffffff;
      padding: 14px 32px;
      border-radius: 999px;
      background: linear-gradient(135deg, #7c3aed, #a855f7);
      box-shadow: 0 8px 20px rgba(124, 58, 237, 0.4);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 26px rgba(124, 58, 237, 0.5);
    }

    button:active {
      transform: translateY(0);
    }

    .result {
      margin-top: 24px;
      font-size: 1.3rem;
      font-weight: 600;
      color: #7c3aed;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    .result.show {
      opacity: 1;
      transform: translateY(0);
    }

    footer {
      position: fixed;
      bottom: 16px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 0.8rem;
      color: rgba(255, 255, 255, 0.85);
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>안녕하세요 👋</h1>
    <p>제 첫 번째 웹 페이지예요</p>
    <button id="clickBtn" type="button">눌러보기</button>
    <div class="result" id="result">🎉 잘 작동해요!</div>
  </div>

  <footer>LG U+ Lifestyle Innovation Workshop</footer>

  <script>
    document.getElementById("clickBtn").addEventListener("click", function () {
      document.getElementById("result").classList.add("show");
    });
  </script>
</body>
</html>
