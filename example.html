<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>안녕하세요 👋</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #0a0a0f;
      --accent: #00ffc6;
      --accent-2: #ff2d95;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Courier New", "D2Coding", ui-monospace, monospace;
      background-color: var(--bg);
      background-image:
        linear-gradient(rgba(0, 255, 198, 0.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 255, 198, 0.06) 1px, transparent 1px);
      background-size: 32px 32px;
      color: #e7fff7;
      padding: 24px;
      overflow: hidden;
    }

    .card {
      position: relative;
      background: rgba(15, 15, 25, 0.6);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(0, 255, 198, 0.35);
      border-radius: 8px;
      padding: 56px 44px;
      max-width: 460px;
      width: 100%;
      text-align: center;
      box-shadow:
        0 0 24px rgba(0, 255, 198, 0.25),
        inset 0 0 24px rgba(0, 255, 198, 0.05);
    }

    .card::before {
      content: "● ● ●";
      position: absolute;
      top: 14px;
      left: 18px;
      font-size: 0.7rem;
      letter-spacing: 4px;
      color: rgba(255, 45, 149, 0.7);
    }

    .card h1 {
      font-size: 2.4rem;
      font-weight: 700;
      margin: 8px 0 14px;
      color: var(--accent);
      text-shadow: 0 0 12px rgba(0, 255, 198, 0.6);
    }

    .card p {
      font-size: 1rem;
      color: #8fb9ad;
      margin-bottom: 32px;
    }

    .card p .cursor {
      display: inline-block;
      width: 9px;
      height: 1.05rem;
      margin-left: 2px;
      background: var(--accent);
      vertical-align: middle;
      animation: blink 1s steps(2) infinite;
    }

    @keyframes blink {
      50% { opacity: 0; }
    }

    button {
      border: 1px solid var(--accent);
      cursor: pointer;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 1px;
      color: var(--bg);
      padding: 14px 36px;
      border-radius: 6px;
      background: var(--accent);
      text-transform: uppercase;
      box-shadow: 0 0 18px rgba(0, 255, 198, 0.5);
      transition: transform 0.12s ease, box-shadow 0.12s ease, background 0.12s ease;
    }

    button:hover {
      transform: translateY(-2px);
      background: #00ffd9;
      box-shadow: 0 0 28px rgba(0, 255, 198, 0.8);
    }

    button:active {
      transform: translateY(0);
    }

    .result {
      margin-top: 28px;
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--accent-2);
      text-shadow: 0 0 12px rgba(255, 45, 149, 0.6);
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    .result.show {
      opacity: 1;
      transform: translateY(0);
    }

    footer {
      position: fixed;
      bottom: 16px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 0.75rem;
      letter-spacing: 1px;
      color: rgba(0, 255, 198, 0.45);
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>안녕하세요 👋</h1>
    <p>&gt; 제 첫 번째 웹 페이지예요<span class="cursor"></span></p>
    <button id="clickBtn" type="button">눌러보기</button>
    <div class="result" id="result">🎉 잘 작동해요!</div>
  </div>

  <footer>LG U+ Lifestyle Innovation Workshop</footer>

  <script>
    document.getElementById("clickBtn").addEventListener("click", function () {
      document.getElementById("result").classList.add("show");
    });
  </script>
</body>
</html>
